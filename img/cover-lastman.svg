<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="0.6" stop-color="#141418"/>
      <stop offset="1" stop-color="#231318"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g stroke="#2a2f3a" stroke-width="1" opacity="0.4">
    <path d="M0 157.5 H1200 M0 315 H1200 M0 472.5 H1200"/>
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630"/>
  </g>

  <!-- 红色聚光灯 -->
  <path d="M1050 60 L880 520 L1220 520 Z" fill="#dc2626" opacity="0.10"/>
  <circle cx="1050" cy="70" r="34" fill="#dc2626" opacity="0.9"/>
  <circle cx="1050" cy="70" r="56" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.5"/>

  <!-- 白色手杖 -->
  <g transform="translate(880,140) rotate(18)">
    <line x1="0" y1="0" x2="26" y2="330" stroke="url(#cane)" stroke-width="14" stroke-linecap="round"/>
    <path d="M26 330 a16 16 0 1 0 16 16" fill="none" stroke="url(#cane)" stroke-width="12" stroke-linecap="round"/>
    <line x1="-16" y1="-30" x2="16" y2="30" stroke="#dc2626" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- 声波 -->
  <g fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M760 260 q10 -30 0 -60"/>
    <path d="M740 280 q20 -50 0 -100" opacity="0.6"/>
    <path d="M720 300 q30 -70 0 -140" opacity="0.35"/>
  </g>

  <!-- 放大镜 -->
  <g transform="translate(1010,420)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#f8fafc" stroke-width="10"/>
    <line x1="34" y1="34" x2="72" y2="72" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-14" cy="-14" r="10" fill="#dc2626"/>
  </g>

  <!-- 日文片名装饰 -->
  <text x="640" y="120" font-family="'Noto Sans JP','PingFang SC',sans-serif" font-size="44"
        font-weight="900" fill="#dc2626" opacity="0.85" transform="rotate(-4 640 120)">ラストマン</text>

  <!-- 标题区 -->
  <rect x="80" y="150" width="10" height="200" rx="5" fill="#dc2626"/>
  <text x="115" y="228" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="2">LAST MAN</text>
  <text x="115" y="308" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="2">全盲搜查官</text>
  <text x="115" y="375" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="1">福山雅治 × 大泉洋 · TBS 2023 日曜剧场</text>

  <!-- 标签 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="22" fill="#cbd5e1">
    <rect x="80" y="470" rx="16" ry="16" width="120" height="44" fill="#1e293b" stroke="#334155"/>
    <text x="140" y="499" text-anchor="middle">日剧</text>
    <rect x="212" y="470" rx="16" ry="16" width="130" height="44" fill="#1e293b" stroke="#334155"/>
    <text x="277" y="499" text-anchor="middle">刑侦</text>
    <rect x="354" y="470" rx="16" ry="16" width="130" height="44" fill="#1e293b" stroke="#334155"/>
    <text x="419" y="499" text-anchor="middle">福山雅治</text>
  </g>

  <text x="1120" y="590" text-anchor="end"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="18" fill="#475569">QQFEEL.COM</text>
</svg>