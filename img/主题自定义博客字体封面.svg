<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">anzhiyu主题自定义博客字体</title>
  <desc id="desc">暖白色瑞士编辑风格封面，左侧为自定义博客字体标题，右侧展示Aa、汉字字和font-family代码。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#151827" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#F4F1EA"/>
  <rect x="28.5" y="28.5" width="1223" height="663" rx="25" fill="none" stroke="#D8D2C6"/>

  <rect x="72" y="65" width="18" height="18" fill="#FF624D"/>
  <text x="106" y="81" fill="#151827" font-family="MiSans, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700" letter-spacing="2">HEXO × ANZHIYU</text>

  <text x="68" y="260" fill="#151827" font-family="MiSans, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="94" font-weight="800">自定义</text>
  <text x="68" y="382" fill="#151827" font-family="MiSans, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="94" font-weight="800">博客字体</text>
  <rect x="72" y="435" width="112" height="10" rx="5" fill="#FF624D"/>
  <text x="72" y="506" fill="#686B76" font-family="MiSans, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="28">ANZHIYU 主题美化指南</text>
  <text x="72" y="644" fill="#686B76" font-family="MiSans, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="20">Gw · HEXO 博客教程</text>

  <rect x="720" y="72" width="488" height="576" rx="36" fill="#151827" filter="url(#shadow)"/>
  <text x="768" y="132" fill="#A7ADBF" font-family="MiSans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FONT-FAMILY</text>
  <text x="758" y="358" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="178">Aa</text>
  <text x="1080" y="358" text-anchor="middle" fill="#FF624D" font-family="'Noto Serif CJK SC', 'Songti SC', SimSun, serif" font-size="142" font-weight="700">字</text>

  <rect x="768" y="452" width="392" height="120" rx="18" fill="#24283A"/>
  <text x="792" y="499" fill="#8E97FF" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="20">font-family:</text>
  <text x="792" y="540" fill="#F4F1EA" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="18">'HuangkaihuaLawyerFont';</text>
  <rect x="768" y="600" width="74" height="5" rx="2.5" fill="#6673FF"/>
</svg>
